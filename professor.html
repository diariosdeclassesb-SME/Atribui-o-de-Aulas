<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DACA — Sistema de Atribuição de Aulas</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { box-sizing: border-box; }
  body { font-family: Arial, Helvetica, sans-serif; margin: 0; background: #e5e7eb; color: #111; font-size: 11px; }
  header.app-header { background: #fff; border-bottom: 1px solid #d1d5db; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
  header.app-header h1 { font-size: 15px; margin: 0; }
  header.app-header nav a { color: #111; text-decoration: none; margin-right: 14px; font-size: 13px; }
  header.app-header nav a.active { color: #2563eb; font-weight: 700; }
  .tabs-page { background: #fff; padding: 0 20px; display: flex; gap: 4px; border-bottom: 1px solid #d1d5db; }
  .tabs-page button { background: none; border: none; padding: 10px 16px; cursor: pointer; font-size: 13px; color: #6b7280; border-bottom: 3px solid transparent; margin-bottom: -1px; }
  .tabs-page button.active { color: #2563eb; border-bottom-color: #2563eb; font-weight: 700; }
  .toolbar { background: #fff; padding: 10px 20px; border-bottom: 1px solid #d1d5db; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .toolbar label { font-size: 12px; color: #6b7280; margin-right: 4px; }
  .toolbar select, .toolbar input { padding: 6px 8px; border: 1px solid #d1d5db; border-radius: 4px; font-size: 13px; }
  .btn { padding: 7px 14px; border: none; border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: 600; }
  .btn-primary { background: #2563eb; color: #fff; } .btn-primary:hover { background: #1e40af; }
  .btn-secondary { background: #e5e7eb; color: #111; }
  .btn-success { background: #059669; color: #fff; } .btn-success:hover { background: #047857; }
  .btn-danger { background: #dc2626; color: #fff; }
  .btn-sm { padding: 4px 10px; font-size: 12px; }
  .view { display: none; } .view.active { display: block; }
  .doc-wrap { padding: 20px 0; display: flex; justify-content: center; }
  .doc { background: #fff; width: 297mm; min-height: 210mm; padding: 6mm 8mm; box-shadow: 0 2px 12px rgba(0,0,0,.15); color: #000; }
  .doc-cabecalho { display: flex; justify-content: space-between; align-items: flex-start; border-bottom: 2px solid #000; padding-bottom: 4px; }
  .doc-cabecalho .esq { display: flex; gap: 10px; align-items: center; flex: 1; }
  .brasao { width: 55px; height: 55px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 8px; color: #666; text-align: center; background: #f9fafb; border: 1px solid #ddd; }
  .brasao img { max-width: 100%; max-height: 100%; }
  .doc-cabecalho .titulo { text-align: center; line-height: 1.3; flex: 1; }
  .doc-cabecalho .titulo .pref { font-weight: 700; font-size: 11px; letter-spacing: .3px; }
  .doc-cabecalho .titulo .sec { font-weight: 700; font-size: 11px; }
  .doc-cabecalho .titulo .end, .doc-cabecalho .titulo .tel { font-size: 8.5px; }
  .doc-cabecalho .dir { text-align: right; font-size: 11px; font-weight: 700; line-height: 1.3; flex-shrink: 0; }
  .doc-cabecalho .dir .ano { font-size: 14px; display: block; }
  .info-grid { display: grid; grid-template-columns: 2.3fr 1.1fr 0.9fr 1.1fr; border: 1px solid #000; border-top: none; }
  .info-grid .cell { border-right: 1px solid #000; border-bottom: 1px solid #000; padding: 2px 5px; font-size: 9px; min-height: 18px; line-height: 1.3; }
  .info-grid .cell:nth-child(4n) { border-right: none; }
  .info-grid .cell .num { font-weight: 700; }
  .info-grid .row-last { border-bottom: none; }
  .field-doc { border: none; background: transparent; font-family: inherit; font-size: 9px; padding: 0 2px; width: 100%; color: #000; }
  .field-doc:focus { background: #fef3c7; outline: 1px solid #f59e0b; }
  .field-doc.auto { background: #f3f4f6; }

  /* Tabela por bloco */
  table.bloco { width: 100%; border-collapse: collapse; margin-top: 4px; font-size: 9px; table-layout: fixed; }
  table.bloco th, table.bloco td { border: 1px solid #000; padding: 1px 3px; vertical-align: middle; }
  table.bloco th { background: #f3f4f6; font-weight: 700; text-align: center; font-size: 8px; line-height: 1.15; }

  /* Bloco vertical */
  td.bloco-label {
    writing-mode: vertical-rl;
    transform: rotate(180deg);
    text-align: center;
    font-weight: 700;
    font-size: 8px;
    padding: 4px 0 !important;
    width: 22px;
    white-space: nowrap;
    vertical-align: middle;
    background: #fafafa;
    letter-spacing: .3px;
  }

  /* Subtítulo (Deixou / Assumiu) */
  td.subtitulo {
    background: #f3f4f6;
    text-align: center;
    font-weight: 700;
    font-size: 9px;
    padding: 3px;
  }

  .field-edit { width: 100%; border: none; background: transparent; font-size: 9px; text-align: center; padding: 0; font-family: inherit; }
  .field-edit:focus { background: #fef3c7; outline: 1px solid #f59e0b; }
  .field-edit::-webkit-outer-spin-button, .field-edit::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .assinatura-linha { border-bottom: 1px solid #000; height: 12px; }
  .ata-box { border: 1px solid #000; border-top: none; padding: 4px 8px; font-size: 8px; line-height: 1.35; text-align: justify; min-height: 90px; }
  .ata-box .ata-label { font-weight: 700; }
  .ata-box:focus { outline: 2px solid #f59e0b; outline-offset: -2px; }
  .assinaturas-finais { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; margin-top: 30px; padding: 0 20px; }
  .assinaturas-finais .item { text-align: center; }
  .assinaturas-finais .linha { border-top: 1px solid #000; margin-bottom: 3px; height: 1px; }
  .assinaturas-finais .rotulo { font-size: 9px; font-weight: 700; letter-spacing: .5px; }

  /* Espaço para o rodapé assinar */
  .assinatura-por-linha {
    display: block;
    border-bottom: 1px solid #000;
    height: 14px;
    margin: 2px 3px;
  }

  .daca-list { max-width: 1100px; margin: 20px auto; padding: 0 16px; }
  .daca-list table { width: 100%; background: #fff; border-radius: 8px; overflow: hidden; font-size: 13px; }
  .daca-list th, .daca-list td { padding: 10px 12px; border-bottom: 1px solid #e5e7eb; text-align: left; }
  .daca-list th { background: #f9fafb; font-size: 12px; text-transform: uppercase; color: #6b7280; }
  .daca-list tr:hover td { background: #f9fafb; }
  @media print {
    @page { size: A4 landscape; margin: 5mm; }
    body { background: #fff; font-size: 10px; }
    header.app-header, .toolbar, .tabs-page, .no-print { display: none !important; }
    .doc-wrap { padding: 0; display: block; }
    .doc { box-shadow: none; width: 100%; min-height: 0; padding: 0; }
    .field-edit:focus, .field-doc:focus, .ata-box:focus { background: transparent; outline: none; }
  }
  .toast { position: fixed; bottom: 20px; right: 20px; background: #111827; color: #fff; padding: 10px 18px; border-radius: 6px; font-size: 13px; opacity: 0; transition: opacity .3s; pointer-events: none; z-index: 9999; }
  .toast.show { opacity: 1; }
  .toast.error { background: #dc2626; } .toast.success { background: #059669; }
</style>
</head>
<body>

<header class="app-header no-print">
  <h1>DACA — Sistema de Atribuição de Aulas</h1>
  <nav>
    <a href="cadastros.html">Cadastros</a>
    <a href="atribuicoes.html">Atribuições</a>
    <a href="configuracoes.html">Configurações</a>
    <a href="relatorio.html">Relatório</a>
    <a href="professor.html" class="active">DACA</a>
    <a href="#" id="logout">Sair</a>
  </nav>
</header>

<div class="tabs-page no-print">
  <button data-view="gerar" class="active">Gerar DACA</button>
  <button data-view="consultar">Consultar DACAs salvas</button>
</div>

<div class="view active" id="view-gerar">
  <div class="toolbar no-print">
    <div><label>Professor:</label><select id="seletor-professor" style="min-width:280px;"><option value="">Carregando...</option></select></div>
    <div><label>Ano:</label><input type="number" id="ano-doc" value="2026" style="width:80px;" /></div>
    <div><label>Data da Atribuição:</label><input type="date" id="data-atribuicao" /></div>
    <button class="btn btn-primary" onclick="window.print()">Imprimir</button>
    <button class="btn btn-success" onclick="salvarDaca()">Salvar DACA</button>
  </div>
  <div class="doc-wrap">
    <div class="doc" id="doc">
      <div style="text-align:center;padding:40px;color:#6b7280;font-size:13px;">Selecione um professor para carregar o documento.</div>
    </div>
  </div>
</div>

<div class="view" id="view-consultar">
  <div class="toolbar no-print">
    <div><label>Professor:</label><select id="filtro-prof" style="min-width:240px;"><option value="">Todos</option></select></div>
    <div><label>Data:</label><input type="date" id="filtro-data" /></div>
    <button class="btn btn-primary" onclick="carregarDacas()">Filtrar</button>
    <button class="btn btn-secondary" onclick="limparFiltrosConsulta()">Limpar</button>
  </div>
  <div class="daca-list">
    <table>
      <thead><tr><th>Professor</th><th>Disciplina</th><th>Data</th><th>Ano</th><th>Unidade Sede</th><th style="width:200px">Ações</th></tr></thead>
      <tbody id="lista-dacas"><tr><td colspan="6" style="text-align:center;color:#6b7280;padding:30px;">Carregando...</td></tr></tbody>
    </table>
  </div>
</div>

<div id="modal-daca" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:9998;overflow:auto;padding:20px;">
  <div style="background:#fff;max-width:1400px;margin:0 auto;border-radius:8px;padding:16px;">
    <div class="no-print" style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
      <h2 style="margin:0;font-size:16px;">DACA salva (somente leitura)</h2>
      <div><button class="btn btn-primary" onclick="window.print()">Imprimir</button>
      <button class="btn btn-secondary" onclick="fecharModal()">Fechar</button></div>
    </div>
    <div id="modal-doc-content"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const SUPABASE_URL = 'https://dflzprsopnwgobcxuqfu.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_HAMF9aaI6tEtztq4pXAVPw_PM_9wyad';
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const MAPA_NOMES_CURTOS = {
  'Creche Municipal "Estudante Renato Cabral Pereira"': 'Creche I',
  'Creche Municipal "Vereador Benedito Cantinho Braga Filho – Diquito Braga"': 'Creche II',
  'Creche Municipal "Vereador Benedito Cantinho Braga Filho - Diquito Braga"': 'Creche II',
  'E.M.E.F. "Barão de Santa Branca"': 'Barão',
  'E.M.E.F. "Prof.ª Palmyra Martins Rosa Perillo"': 'Palmyra',
  'E.M.E.F. "Prof.ª Benedita Pereira de Albuquerque"': 'Benedita',
  'E.M.E.F. "Prof.ª Francisca Rosa Gomes"': 'Rosa Gomes',
  'E.M.E.F. "Prof.ª Isaura Martins Rosa de Siqueira"': 'Isaura',
  'E.M.E.I. "Terezinha do Menino Jesus Porto Wuó"': 'Terezinha',
  'E.M.E.I.F (R) "Prof.ª Maria Apparecida Fonseca"': 'Fonseca',
  'E.M.E.I.F (R) "Prof.ª Sylvia Cantinho Braga Campos"': 'Sylvia',
};

function nomeCurto(nomeCompleto, shortName) {
  if (shortName && shortName.trim()) return shortName.trim();
  if (MAPA_NOMES_CURTOS[nomeCompleto]) return MAPA_NOMES_CURTOS[nomeCompleto];
  return nomeCompleto;
}

const $ = (id) => document.getElementById(id);
function toast(msg, tipo = '') {
  const t = $('toast'); t.textContent = msg;
  t.className = 'toast show' + (tipo ? ' ' + tipo : '');
  setTimeout(() => t.className = 'toast', 2500);
}
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function dataHojeBR() { return new Date().toLocaleDateString('pt-BR'); }
function dataBR(iso) { if (!iso) return ''; const [y,m,d] = iso.split('-'); return `${d}/${m}/${y}`; }
function abreviarDisciplina(nome) {
  if (nome === 'História') return 'His.';
  if (nome === 'Religiosidade') return 'Rel.';
  return null;
}

async function requireLogin() {
  const { data: { session } } = await supabaseClient.auth.getSession();
  if (!session) { window.location.href = 'index.html'; return null; }
  return session;
}
async function logout() { await supabaseClient.auth.signOut(); window.location.href = 'index.html'; }

document.querySelectorAll('.tabs-page button').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('.tabs-page button').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    btn.classList.add('active');
    $('view-' + btn.dataset.view).classList.add('active');
    if (btn.dataset.view === 'consultar') carregarDacas();
  };
});

let professores = [];
let dadosDaca = { titular: [], carga: [], deixou: [], assumiu: [] };
let manuais = {};
let dadosProf = {};
let teacherAtualId = null;
let settings = {};

async function carregarSettings() {
  const { data } = await supabaseClient.from('daca_settings').select('*').eq('id', 1).maybeSingle();
  settings = data || {};
}
async function carregarProfessores() {
  const { data, error } = await supabaseClient.from('teachers').select('id, full_name, rg, cpf, disciplines(name)').order('full_name');
  if (error) return toast(error.message, 'error');
  professores = data || [];
  const opts = professores.map(p => `<option value="${p.id}">${esc(p.full_name)} — ${esc(p.disciplines?.name || 'sem disciplina')}</option>`).join('');
  $('seletor-professor').innerHTML = '<option value="">Selecione...</option>' + opts;
  $('filtro-prof').innerHTML = '<option value="">Todos</option>' + opts;
}
async function carregarDadosProf(teacherId) {
  const { data } = await supabaseClient.from('teacher_daca_data').select('*').eq('teacher_id', teacherId).maybeSingle();
  dadosProf = data || {};
}
async function carregarManuais(teacherId) {
  const { data } = await supabaseClient.from('daca_manual_fields').select('*').eq('teacher_id', teacherId);
  manuais = {};
  (data || []).forEach(m => {
    manuais[`${m.assignment_id}|${m.bloco}`] = {
      hec: m.hec, ha: m.ha, hll: m.hll, total_sm: m.total_sm,
    };
  });
}

async function carregarDaca(teacherId) {
  if (!teacherId) {
    teacherAtualId = null;
    $('doc').innerHTML = '<div style="text-align:center;padding:40px;color:#6b7280;font-size:13px;">Selecione um professor para carregar o documento.</div>';
    return;
  }
  teacherAtualId = teacherId;
  const { data, error } = await supabaseClient.rpc('get_teacher_daca', { p_teacher_id: teacherId });
  if (error) return toast(error.message, 'error');
  dadosDaca = { titular: [], carga: [], deixou: [], assumiu: [] };
  (data || []).forEach(r => { dadosDaca[r.bloco].push(r); });
  await Promise.all([carregarManuais(teacherId), carregarDadosProf(teacherId)]);
  renderizar();
}

function calcularUnidadeSede(dd) {
  const contagem = {};
  ['titular', 'carga', 'assumiu'].forEach(b => { dd[b].forEach(r => { contagem[r.school_name] = (contagem[r.school_name] || 0) + 1; }); });
  return Object.keys(contagem).sort((a,b) => contagem[b] - contagem[a])[0] || '—';
}

function gerarAtaDoTemplate(professorNome, turmas) {
  const tpl = settings.ata_template;
  if (!tpl) return 'Aos <strong>_____</strong> dias do mês de <strong>_____</strong>, reuniu-se a Comissão de Atribuição para proceder às escolhas do professor <strong>' + esc(professorNome) + '</strong> para as turmas <strong>' + esc(turmas) + '</strong>. (clique aqui para editar)';

  let texto = tpl.replace(/\{\{professor\}\}/g, professorNome).replace(/\{\{turmas\}\}/g, turmas);
  const partes = ['<strong>' + professorNome + '</strong>', '<strong>' + turmas + '</strong>'];
  let i = 0;
  texto = texto.replace(/_{5,}/g, () => partes[Math.min(i++, partes.length-1)]);
  return texto;
}

function renderizar() {
  const prof = professores.find(p => p.id === teacherAtualId);
  if (!prof) return;
  const ano = $('ano-doc').value || '2026';
  const dataAtrib = $('data-atribuicao').value ? dataBR($('data-atribuicao').value) : dataHojeBR();
  const unidadeSede = calcularUnidadeSede(dadosDaca);

  const todas = [...dadosDaca.titular, ...dadosDaca.carga, ...dadosDaca.assumiu];
  const listaTurmas = [...new Set(todas.map(t => {
    const ab = abreviarDisciplina(t.discipline_name);
    return ab ? `${t.class_name} (${ab})` : t.class_name;
  }))].join(', ') || '—';

  const ataTexto = gerarAtaDoTemplate(prof.full_name, listaTurmas);

  $('doc').innerHTML = renderDocumento({
    settings, professor: prof, dadosProf, dadosDaca, manuais,
    ano, dataAtrib, unidadeSede, ataTexto, editavel: true,
  });
}

// Calcula totais por período de uma lista
function totaisPorPeriodo(lista) {
  const t = { M: 0, T: 0, N: 0, I: 0 };
  lista.forEach(r => {
    const per = (r.class_period || '').charAt(0).toUpperCase();
    if (t[per] !== undefined) t[per] += r.lesson_count || 0;
  });
  return t;
}

function renderDocumento(ctx) {
  const { settings, professor, dadosProf: dp, dadosDaca: dd, manuais: mm, ano, dataAtrib, unidadeSede, ataTexto, editavel } = ctx;

  const inputTag = (id, valor, campo, classe) => editavel
    ? `<input class="field-doc ${classe||''}" id="${id}" data-campo="${campo}" value="${esc(valor||'')}">`
    : `<span style="font-size:9px;">${esc(valor || '—')}</span>`;

  const selectTag = (id, valor, campo, opcoes) => {
    if (!editavel) return `<span style="font-size:9px;">${esc(valor || '—')}</span>`;
    return `<select class="field-doc" id="${id}" data-campo="${campo}">
      <option value="">—</option>
      ${opcoes.map(o => `<option value="${o}" ${valor === o ? 'selected' : ''}>${o}</option>`).join('')}
    </select>`;
  };

  const pref = settings.prefeitura || 'PREFEITURA MUNICIPAL DE SANTA BRANCA';
  const sec = settings.secretaria || 'SECRETARIA MUNICIPAL DE EDUCAÇÃO';
  const end = settings.endereco || 'Rua Independência, s/nº - Centro - Santa Branca – São Paulo – CEP: 12.380-000';
  const tel = settings.telefone || 'Tel: (12) 3972-1686 - 3972-3061';
  const mail = settings.email || 'semebranca@gmail.com';
  const logo = settings.logo_url;
  const logoHtml = logo
    ? `<img src="${esc(logo)}" alt="Brasão" onerror="this.style.display='none';this.parentNode.innerHTML='BRASÃO';">`
    : 'BRASÃO';

  // Colunas compartilhadas entre as 3 tabelas
  const colgroupHtml = `
    <colgroup>
      <col style="width:22px">
      <col style="width:70px">
      <col>
      <col style="width:24px">
      <col style="width:24px">
      <col style="width:24px">
      <col style="width:36px">
      <col style="width:36px">
      <col style="width:44px">
      <col style="width:36px">
      <col style="width:36px">
      <col style="width:36px">
      <col style="width:56px">
      <col style="width:70px">
    </colgroup>`;

  // Cabeçalho (só na primeira tabela)
  const theadHtml = `
    <thead>
      <tr>
        <th rowspan="2" class="bloco-label">Bloco</th>
        <th rowspan="2">Unidade Escolar</th>
        <th rowspan="2">Classes Atribuídas</th>
        <th colspan="3">Período</th>
        <th colspan="2">Situação das Aulas</th>
        <th rowspan="2">Nº de Aulas Semanais</th>
        <th rowspan="2">H.E.C</th>
        <th rowspan="2">H.A</th>
        <th rowspan="2">H.L.L.E</th>
        <th rowspan="2">Total de Aulas Semanal/Mensal</th>
        <th rowspan="2">Assinatura</th>
      </tr>
      <tr>
        <th>M</th>
        <th>T</th>
        <th>N</th>
        <th>Livre</th>
        <th>Subs.</th>
      </tr>
    </thead>`;

  return `
    <div class="doc-cabecalho">
      <div class="esq">
        <div class="brasao">${logoHtml}</div>
        <div class="titulo">
          <div class="pref">${esc(pref)}</div>
          <div class="sec">${esc(sec)}</div>
          <div class="end">${esc(end)}</div>
          <div class="tel">${esc(tel)} &nbsp;&nbsp; e-mail: ${esc(mail)}</div>
        </div>
      </div>
      <div class="dir">DACA - DOCUMENTO DE ATRIBUIÇÃO<br>DE CLASSES E AULAS <span class="ano">${esc(ano)}</span></div>
    </div>

    <div class="info-grid">
      <div class="cell"><span class="num">1- Unidade Sede de Controle de Frequência:</span>${inputTag('f-unidade', unidadeSede, 'unidade_sede', 'auto')}</div>
      <div class="cell"><span class="num">2- Data da Atribuição:</span> <span style="font-size:9px;">${esc(dataAtrib)}</span></div>
      <div class="cell"><span class="num">3- PEB:</span>${selectTag('f-peb', dp.peb, 'peb', ['PEB I', 'PEB II', 'PEB III'])}</div>
      <div class="cell"><span class="num">4- Disciplina:</span> <span style="font-size:9px;">${esc(professor.disciplines?.name || '—')}</span></div>

      <div class="cell"><span class="num">5- Classificação:</span>${inputTag('f-classificacao', dp.classificacao, 'classificacao')}</div>

// Renderiza uma tabela de bloco (Titular ou Carga Suplementar)
function renderTabelaBloco(rotulo, bloco, lista, mm, editavel, comThead, colgroupHtml, theadHtml, colunaSoma) {
  const temLinhas = lista && lista.length > 0;

  // Totais por período
  const totais = totaisPorPeriodo(lista || []);
  const totalSemanal = (lista || []).reduce((s, r) => s + (r.lesson_count || 0), 0);
  const totalLivre = totalSemanal; // Titular e Carga Suplementar contam como Livre
  const totalSubs = 0;

  // Corpo
  let corpo = '';
  if (!temLinhas) {
    corpo = `<tr>
      <td class="bloco-label" rowspan="1">${rotulo}</td>
      <td colspan="13" style="text-align:center;color:#6b7280;">Nenhuma turma neste bloco</td>
    </tr>`;
  } else {
    corpo = lista.map((r, i) => {
      const key = `${r.assignment_id}|${bloco}`;
      const m = mm[key] || { hec: '', ha: '', hll: '', total_sm: '' };
      const val = v => v === null || v === undefined || v === '' ? '' : v;
      const nomeEscola = nomeCurto(r.school_name, r.school_short_name);
      const ab = abreviarDisciplina(r.discipline_name);
      const turmaLabel = ab ? `${r.class_name} (${ab})` : r.class_name;
      const rowspanInicial = i === 0 ? lista.length : 0;

      // Na primeira linha do bloco, coloca os totais; nas demais, vazio
      const primeira = i === 0;
      const colM = primeira ? totais.M || '' : '';
      const colT = primeira ? totais.T || '' : '';
      const colN = primeira ? totais.N || '' : '';
      const colLivre = primeira ? totalLivre || '' : '';
      const colSubs = primeira ? totalSubs || '' : '';
      const colAulasSemanais = primeira ? totalSemanal || '' : '';

      const inputEdit = (campo, valor) => editavel
        ? `<input class="field-edit" type="text" data-key="${key}" data-campo="${campo}" value="${val(valor)}">`
        : `<span style="font-size:9px;">${val(valor) || ''}</span>`;

      return `<tr>
        ${i === 0 ? `<td class="bloco-label" rowspan="${lista.length}">${rotulo}</td>` : ''}
        <td>${esc(nomeEscola)}</td>
        <td>${esc(turmaLabel)}</td>
        <td style="text-align:center;">${colM}</td>
        <td style="text-align:center;">${colT}</td>
        <td style="text-align:center;">${colN}</td>
        <td style="text-align:center;">${colLivre}</td>
        <td style="text-align:center;">${colSubs}</td>
        <td style="text-align:center;">${colAulasSemanais}</td>
        <td>${inputEdit('hec', m.hec)}</td>
        <td>${inputEdit('ha', m.ha)}</td>
        <td>${inputEdit('hll', m.hll)}</td>
        <td>${inputEdit('total_sm', m.total_sm)}</td>
        <td><div class="assinatura-por-linha"></div></td>
      </tr>`;
    }).join('');
  }

  return `<table class="bloco">
    ${colgroupHtml}
    ${comThead ? theadHtml : ''}
    <tbody>${corpo}</tbody>
  </table>`;
}

// Renderiza tabela do bloco Substituição (tem 2 subtítulos: Deixou / Assumiu)
function renderTabelaBlocoSubstituicao(deixou, assumiu, mm, editavel, colgroupHtml) {
  const totDeixou = totaisPorPeriodo(deixou || []);
  const totAssumiu = totaisPorPeriodo(assumiu || []);
  const totalAulasDeixou = (deixou || []).reduce((s, r) => s + (r.lesson_count || 0), 0);
  const totalAulasAssumiu = (assumiu || []).reduce((s, r) => s + (r.lesson_count || 0), 0);

  const linhas = [];
  linhas.push(`<tr><td colspan="14" class="subtitulo">Deixou as seguintes Classes:</td></tr>`);

  if (!deixou || deixou.length === 0) {
    linhas.push(`<tr><td colspan="14" style="text-align:center;color:#6b7280;font-size:9px;">—</td></tr>`);
  } else {
    deixou.forEach((r, i) => {
      const key = `${r.assignment_id}|deixou`;
      const m = mm[key] || { hec: '', ha: '', hll: '', total_sm: '' };
      const val = v => v === null || v === undefined || v === '' ? '' : v;
      const nomeEscola = nomeCurto(r.school_name, r.school_short_name);
      const ab = abreviarDisciplina(r.discipline_name);
      const turmaLabel = ab ? `${r.class_name} (${ab})` : r.class_name;
      const primeira = i === 0;
      const inputEdit = (campo, valor) => editavel
        ? `<input class="field-edit" type="text" data-key="${key}" data-campo="${campo}" value="${val(valor)}">`
        : `<span style="font-size:9px;">${val(valor) || ''}</span>`;

      linhas.push(`<tr>
        <td>${esc(nomeEscola)}</td>
        <td>${esc(turmaLabel)}</td>
        <td style="text-align:center;">${primeira ? (totDeixou.M || '') : ''}</td>
        <td style="text-align:center;">${primeira ? (totDeixou.T || '') : ''}</td>
        <td style="text-align:center;">${primeira ? (totDeixou.N || '') : ''}</td>
        <td style="text-align:center;"></td>
        <td style="text-align:center;"></td>
        <td style="text-align:center;">${primeira ? (totalAulasDeixou || '') : ''}</td>
        <td>${inputEdit('hec', m.hec)}</td>
        <td>${inputEdit('ha', m.ha)}</td>
        <td>${inputEdit('hll', m.hll)}</td>
        <td>${inputEdit('total_sm', m.total_sm)}</td>
        <td><div class="assinatura-por-linha"></div></td>
      </tr>`);
    });
  }

  linhas.push(`<tr><td colspan="14" class="subtitulo">Assumiu as seguintes Classes:</td></tr>`);

  if (!assumiu || assumiu.length === 0) {
    linhas.push(`<tr><td colspan="14" style="text-align:center;color:#6b7280;font-size:9px;">—</td></tr>`);
  } else {
    assumiu.forEach((r, i) => {
      const key = `${r.assignment_id}|assumiu`;
      const m = mm[key] || { hec: '', ha: '', hll: '', total_sm: '' };
      const val = v => v === null || v === undefined || v === '' ? '' : v;
      const nomeEscola = nomeCurto(r.school_name, r.school_short_name);
      const ab = abreviarDisciplina(r.discipline_name);
      const turmaLabel = ab ? `${r.class_name} (${ab})` : r.class_name;
      const primeira = i === 0;
      const inputEdit = (campo, valor) => editavel
        ? `<input class="field-edit" type="text" data-key="${key}" data-campo="${campo}" value="${val(valor)}">`
        : `<span style="font-size:9px;">${val(valor) || ''}</span>`;

      linhas.push(`<tr>
        <td>${esc(nomeEscola)}</td>
        <td>${esc(turmaLabel)}</td>
        <td style="text-align:center;">${primeira ? (totAssumiu.M || '') : ''}</td>
        <td style="text-align:center;">${primeira ? (totAssumiu.T || '') : ''}</td>
        <td style="text-align:center;">${primeira ? (totAssumiu.N || '') : ''}</td>
        <td style="text-align:center;"></td>
        <td style="text-align:center;">${primeira ? (totalAulasAssumiu || '') : ''}</td>
        <td style="text-align:center;">${primeira ? (totalAulasAssumiu || '') : ''}</td>
        <td>${inputEdit('hec', m.hec)}</td>
        <td>${inputEdit('ha', m.ha)}</td>
        <td>${inputEdit('hll', m.hll)}</td>
        <td>${inputEdit('total_sm', m.total_sm)}</td>
        <td><div class="assinatura-por-linha"></div></td>
      </tr>`);
    });
  }

  return `<table class="bloco">
    ${colgroupHtml}
    <tbody>
      <tr>
        <td class="bloco-label" rowspan="${linhas.length}">III - Substituição</td>
        <td colspan="13" style="padding:0;border:none;">
          <table style="width:100%;border-collapse:collapse;table-layout:fixed;">
            <colgroup>
              <col style="width:70px">
              <col>
              <col style="width:24px"><col style="width:24px"><col style="width:24px">

              <col style="width:44px">
              <col style="width:36px"><col style="width:36px"><col style="width:36px">
              <col style="width:56px">
              <col style="width:70px">
            </colgroup>
            <tbody>${linhas.join('')}</tbody>
          </table>
        </td>
      </tr>
    </tbody>
  </table>`;
}

async function salvarDaca() {
  if (!teacherAtualId) return toast('Selecione um professor primeiro', 'error');
  const prof = professores.find(p => p.id === teacherAtualId);
  const ano = parseInt($('ano-doc').value, 10);
  const dataAtrib = $('data-atribuicao').value || new Date().toISOString().slice(0, 10);
  const ataTexto = $('ata-texto').innerHTML.replace(/^<span class="ata-label">ATA:<\/span>\s*/, '').trim();

  const dadosProfSnap = {
    prof_nome: $('f-nome')?.value || prof.full_name,
    prof_rg: $('f-rg')?.value || prof.rg || null,
    prof_cpf: $('f-cpf')?.value || prof.cpf || null,
    prof_peb: $('f-peb')?.value || null,
    prof_classificacao: $('f-classificacao')?.value || null,
    prof_jornada: $('f-jornada')?.value || null,
    prof_categoria: $('f-categoria')?.value || null,
    prof_afastamento: $('f-afastamento')?.value || null,
    prof_carga_suplementar: $('f-carga-sup')?.value || null,
    prof_professor_excedente: $('f-excedente')?.value || null,
    prof_disciplina: prof.disciplines?.name || null,
  };

  await supabaseClient.from('teacher_daca_data').upsert({
    teacher_id: teacherAtualId,
    peb: dadosProfSnap.prof_peb, classificacao: dadosProfSnap.prof_classificacao,
    rg: dadosProfSnap.prof_rg, cpf: dadosProfSnap.prof_cpf,
    jornada: dadosProfSnap.prof_jornada, categoria: dadosProfSnap.prof_categoria,
    afastamento: dadosProfSnap.prof_afastamento,
    carga_suplementar: dadosProfSnap.prof_carga_suplementar,
    professor_excedente: dadosProfSnap.prof_professor_excedente,
    updated_at: new Date().toISOString(),
  }, { onConflict: 'teacher_id' });

  if (dadosProfSnap.prof_rg || dadosProfSnap.prof_cpf) {
    await supabaseClient.from('teachers').update({ rg: dadosProfSnap.prof_rg, cpf: dadosProfSnap.prof_cpf }).eq('id', teacherAtualId);
  }

  const inputs = document.querySelectorAll('input.field-edit[data-key]');
  const agrupados = {};
  inputs.forEach(inp => {
    const key = inp.dataset.key; const campo = inp.dataset.campo;
    const [assignment_id, bloco] = key.split('|');
    if (!agrupados[key]) agrupados[key] = { assignment_id, bloco, hec: null, ha: null, hll: null, total_sm: null };
    agrupados[key][campo] = inp.value === '' ? null : inp.value;
  });

  const unidadeSede = $('f-unidade')?.value || calcularUnidadeSede(dadosDaca);

  const { data: rec, error: errRec } = await supabaseClient.from('daca_records').insert({
    teacher_id: teacherAtualId, data_atribuicao: dataAtrib, ano_documento: ano,
    unidade_sede: unidadeSede, texto_ata: ataTexto,
    header_prefeitura: settings.prefeitura, header_secretaria: settings.secretaria,
    header_endereco: settings.endereco, header_telefone: settings.telefone,
    header_email: settings.email, header_logo_url: settings.logo_url,
    ...dadosProfSnap,
  }).select().single();
  if (errRec) return toast('Erro DACA: ' + errRec.message, 'error');

  const todas = [...dadosDaca.titular, ...dadosDaca.carga, ...dadosDaca.deixou, ...dadosDaca.assumiu];
  const registros = Object.values(agrupados).map(a => {
    const r = todas.find(x => x.assignment_id === a.assignment_id && x.bloco === a.bloco);
    if (!r) return null;
    return {
      daca_record_id: rec.id, assignment_id: r.assignment_id, bloco: a.bloco,
      school_name: nomeCurto(r.school_name, r.school_short_name), class_name: r.class_name,
      class_period: r.class_period, discipline_name: r.discipline_name,
      lesson_count: r.lesson_count,
      hec: a.hec ? parseInt(a.hec, 10) : 0,
      ha: a.ha ? parseInt(a.ha, 10) : 0,
      hll: a.hll ? parseInt(a.hll, 10) : 0,
      total_sm: a.total_sm || null,
    };
  }).filter(Boolean);

  if (registros.length > 0) {
    const { error: errLinhas } = await supabaseClient.from('daca_records_assignments').insert(registros);
    if (errLinhas) return toast('Erro linhas: ' + errLinhas.message, 'error');
  }

  if (Object.keys(agrupados).length > 0) {
    const regs = Object.values(agrupados).map(r => ({
      teacher_id: teacherAtualId, assignment_id: r.assignment_id, bloco: r.bloco,
      hec: r.hec ? parseInt(r.hec, 10) : 0,
      ha: r.ha ? parseInt(r.ha, 10) : 0,
      hll: r.hll ? parseInt(r.hll, 10) : 0,
      total_sm: r.total_sm || null,
      updated_at: new Date().toISOString(),
    }));
    await supabaseClient.from('daca_manual_fields').upsert(regs, { onConflict: 'teacher_id,assignment_id,bloco' });
  }

  toast('DACA salva com sucesso', 'success');
}

async function carregarDacas() {
  const profId = $('filtro-prof').value || null;
  const dataFiltro = $('filtro-data').value || null;
  let q = supabaseClient.from('daca_records').select('*, teachers(full_name)').order('data_atribuicao', { ascending: false });
  if (profId) q = q.eq('teacher_id', profId);
  if (dataFiltro) q = q.eq('data_atribuicao', dataFiltro);
  const { data, error } = await q;
  if (error) return toast(error.message, 'error');
  const linhas = data || [];
  $('lista-dacas').innerHTML = linhas.length
    ? linhas.map(d => `<tr>
        <td>${esc(d.teachers?.full_name || d.prof_nome || '—')}</td>
        <td>${esc(d.prof_disciplina || '—')}</td>
        <td>${dataBR(d.data_atribuicao)}</td>
        <td>${d.ano_documento}</td>
        <td>${esc(d.unidade_sede || '—')}</td>
        <td><button class="btn btn-primary btn-sm" onclick="verDaca('${d.id}')">Ver</button>
        <button class="btn btn-danger btn-sm" onclick="excluirDaca('${d.id}')">Excluir</button></td>
      </tr>`).join('')
    : '<tr><td colspan="6" style="text-align:center;color:#6b7280;padding:30px;">Nenhuma DACA encontrada.</td></tr>';
}
function limparFiltrosConsulta() { $('filtro-prof').value = ''; $('filtro-data').value = ''; carregarDacas(); }

async function verDaca(id) {
  const { data: rec, error: err1 } = await supabaseClient.from('daca_records').select('*').eq('id', id).single();
  if (err1) return toast(err1.message, 'error');
  const { data: linhas, error: err2 } = await supabaseClient.from('daca_records_assignments').select('*').eq('daca_record_id', id);
  if (err2) return toast(err2.message, 'error');

  const dd = { titular: [], carga: [], deixou: [], assumiu: [] };
  const mm = {};
  (linhas || []).forEach(r => {
    const item = {
      assignment_id: r.assignment_id, school_name: r.school_name, school_short_name: r.school_name,
      class_name: r.class_name, class_period: r.class_period,
      discipline_name: r.discipline_name, lesson_count: r.lesson_count,
    };
    dd[r.bloco].push(item);
    mm[`${r.assignment_id}|${r.bloco}`] = { hec: r.hec, ha: r.ha, hll: r.hll, total_sm: r.total_sm };
  });

  const ctx = {
    settings: { prefeitura: rec.header_prefeitura, secretaria: rec.header_secretaria, endereco: rec.header_endereco, telefone: rec.header_telefone, email: rec.header_email, logo_url: rec.header_logo_url },
    professor: { full_name: rec.prof_nome, rg: rec.prof_rg, cpf: rec.prof_cpf, disciplines: { name: rec.prof_disciplina } },
    dadosProf: { peb: rec.prof_peb, classificacao: rec.prof_classificacao, rg: rec.prof_rg, cpf: rec.prof_cpf, jornada: rec.prof_jornada, categoria: rec.prof_categoria, afastamento: rec.prof_afastamento, carga_suplementar: rec.prof_carga_suplementar, professor_excedente: rec.prof_professor_excedente },
    dadosDaca: dd, manuais: mm,
    ano: rec.ano_documento, dataAtrib: dataBR(rec.data_atribuicao),
    unidadeSede: rec.unidade_sede, ataTexto: rec.texto_ata, editavel: false,
  };

  $('modal-doc-content').innerHTML = `<div class="doc">${renderDocumento(ctx)}</div>`;
  $('modal-daca').style.display = 'block';
}
function fecharModal() { $('modal-daca').style.display = 'none'; }
async function excluirDaca(id) {
  if (!confirm('Excluir esta DACA? A ação não pode ser desfeita.')) return;
  const { error } = await supabaseClient.from('daca_records').delete().eq('id', id);
  if (error) return toast(error.message, 'error');
  toast('DACA excluída', 'success'); carregarDacas();
}

$('seletor-professor').addEventListener('change', e => carregarDaca(e.target.value));

})();
