<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DACA — Sistema de Atribuição de Aulas</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: Arial, Helvetica, sans-serif;
    margin: 0; background: #e5e7eb; color: #111;
    font-size: 11px;
  }
  header.app-header {
    background: #fff; border-bottom: 1px solid #d1d5db;
    padding: 10px 20px; display: flex; justify-content: space-between;
    align-items: center; position: sticky; top: 0; z-index: 100;
  }
  header.app-header h1 { font-size: 15px; margin: 0; }
  header.app-header nav a {
    color: #111; text-decoration: none; margin-right: 14px; font-size: 13px;
  }
  header.app-header nav a.active { color: #2563eb; font-weight: 700; }

  .toolbar {
    background: #fff; padding: 10px 20px; border-bottom: 1px solid #d1d5db;
    display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
  }
  .toolbar label { font-size: 12px; color: #6b7280; margin-right: 4px; }
  .toolbar select, .toolbar input {
    padding: 6px 8px; border: 1px solid #d1d5db; border-radius: 4px;
    font-size: 13px;
  }
  .btn {
    padding: 7px 14px; border: none; border-radius: 4px;
    cursor: pointer; font-size: 13px; font-weight: 600;
  }
  .btn-primary { background: #2563eb; color: #fff; }
  .btn-primary:hover { background: #1e40af; }
  .btn-secondary { background: #e5e7eb; color: #111; }
  .btn-secondary:hover { background: #d1d5db; }

  /* =============== DOCUMENTO =============== */
  .doc-wrap { padding: 20px 0; display: flex; justify-content: center; }
  .doc {
    background: #fff;
    width: 297mm;
    min-height: 210mm;
    padding: 6mm 8mm;
    box-shadow: 0 2px 12px rgba(0,0,0,.15);
    color: #000;
  }

  /* Cabeçalho */
  .doc-cabecalho {
    display: flex; justify-content: space-between; align-items: flex-start;
    border-bottom: 2px solid #000; padding-bottom: 4px;
  }
  .doc-cabecalho .esq {
    display: flex; gap: 10px; align-items: center; flex: 1;
  }
  .brasao {
    width: 55px; height: 55px; flex-shrink: 0;
    border: 1px solid #999;
    display: flex; align-items: center; justify-content: center;
    font-size: 8px; color: #666; text-align: center; line-height: 1.2;
    background: #f9fafb;
  }
  .brasao img { max-width: 100%; max-height: 100%; }
  .doc-cabecalho .titulo {
    text-align: center; line-height: 1.3; flex: 1;
  }
  .doc-cabecalho .titulo .pref {
    font-weight: 700; font-size: 11px; letter-spacing: .3px;
  }
  .doc-cabecalho .titulo .sec {
    font-weight: 700; font-size: 11px;
  }
  .doc-cabecalho .titulo .end,
  .doc-cabecalho .titulo .tel {
    font-size: 8.5px;
  }
  .doc-cabecalho .dir {
    text-align: right;
    font-size: 11px; font-weight: 700; line-height: 1.3;
    flex-shrink: 0;
  }
  .doc-cabecalho .dir .ano { font-size: 14px; display: block; }

  /* Bloco de identificação 1–13 */
  .info-grid {
    display: grid;
    grid-template-columns: 2.3fr 1.1fr 0.9fr 1.1fr;
    border: 1px solid #000;
    border-top: none;
    margin-top: 0;
  }
  .info-grid .cell {
    border-right: 1px solid #000;
    border-bottom: 1px solid #000;
    padding: 2px 5px;
    font-size: 9px;
    min-height: 18px;
    line-height: 1.3;
  }
  .info-grid .cell:nth-child(4n) { border-right: none; }
  .info-grid .cell .num { font-weight: 700; }
  .info-grid .cell .val { font-weight: 400; }
  .info-grid .row-last { border-bottom: none; }

  /* Tabela de blocos I / II / III */
  table.daca {
    width: 100%; border-collapse: collapse; margin-top: 4px;
    font-size: 9px;
    table-layout: fixed;
  }
  table.daca th, table.daca td {
    border: 1px solid #000;
    padding: 1px 3px;
    vertical-align: middle;
  }
  table.daca th {
    background: #f3f4f6; font-weight: 700; text-align: center;
    font-size: 8.5px;
    line-height: 1.15;
  }
  .bloco-label {
    writing-mode: vertical-rl;
    transform: rotate(180deg);
    text-align: center;
    font-weight: 700;
    font-size: 9px;
    padding: 6px 1px !important;
    width: 20px;
    letter-spacing: 1px;
  }
  .col-escola { width: 90px; }
  .col-turma { width: 30px; }
  .col-turmas { width: auto; }
  .col-periodo { width: 28px; text-align: center; }
  .col-situacao { width: 32px; text-align: center; }
  .col-sem { width: 30px; text-align: center; }
  .col-mes { width: 40px; text-align: center; }
  .col-assin { width: 80px; text-align: center; }

  .sub-header th { background: #e5e7eb; font-size: 7.5px; }

  .linha-turma td { height: 16px; font-size: 9px; }

  .sec-titulo {
    background: #f3f4f6; text-align: center; font-weight: 700;
    font-size: 9px; padding: 2px;
  }

  .field-edit {
    width: 100%; border: none; background: transparent;
    font-size: 9px; text-align: center; padding: 0;
    font-family: inherit;
  }
  .field-edit:focus {
    background: #fef3c7; outline: 1px solid #f59e0b;
  }
  /* Remove as setinhas do input number */
  .field-edit::-webkit-outer-spin-button,
  .field-edit::-webkit-inner-spin-button {
    -webkit-appearance: none; margin: 0;
  }
  .field-edit[type=number] { -moz-appearance: textfield; }

  .assinatura-linha {
    border-bottom: 1px solid #000;
    height: 12px;
  }

  /* Rodapé ATA */
  .ata-box {
    border: 1px solid #000;
    border-top: none;
    padding: 4px 8px;
    font-size: 8px;
    line-height: 1.35;
    text-align: justify;
    min-height: 90px;
  }
  .ata-box .ata-label { font-weight: 700; }
  .ata-box:focus {
    outline: 2px solid #f59e0b; outline-offset: -2px;
  }

  /* Assinaturas finais */
  .assinaturas-finais {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 30px;
    margin-top: 20px;
    padding: 0 20px;
  }
  .assinaturas-finais .item { text-align: center; }
  .assinaturas-finais .linha {
    border-top: 1px solid #000;
    margin-bottom: 3px;
    height: 1px;
  }
  .assinaturas-finais .rotulo {
    font-size: 9px; font-weight: 700; letter-spacing: .5px;
  }

  /* Impressão */
  @media print {
    @page { size: A4 landscape; margin: 5mm; }
    body { background: #fff; font-size: 10px; }
    header.app-header, .toolbar, .no-print { display: none !important; }
    .doc-wrap { padding: 0; display: block; }
    .doc {
      box-shadow: none; width: 100%; min-height: 0;
      padding: 0;
    }
    .field-edit:focus { background: transparent; outline: none; }
    .ata-box:focus { outline: none; }
  }

  .toast {
    position: fixed; bottom: 20px; right: 20px;
    background: #111827; color: #fff;
    padding: 10px 18px; border-radius: 6px; font-size: 13px;
    opacity: 0; transition: opacity .3s; pointer-events: none;
    z-index: 9999;
  }
  .toast.show { opacity: 1; }
  .toast.error { background: #dc2626; }
  .toast.success { background: #059669; }
</style>
</head>
<body>

<header class="app-header no-print">
  <h1>DACA — Sistema de Atribuição de Aulas</h1>
  <nav>
    <a href="cadastros.html">Cadastros</a>
    <a href="atribuicoes.html">Atribuições</a>
    <a href="professor.html" class="active">DACA</a>
    <a href="#" id="logout">Sair</a>
  </nav>
</header>

<div class="toolbar no-print">
  <div>
    <label>Professor:</label>
    <select id="seletor-professor" style="min-width:280px;">
      <option value="">Carregando...</option>
    </select>
  </div>
  <div>
    <label>Ano do documento:</label>
    <input type="number" id="ano-doc" value="2026" style="width:80px;" />
  </div>
  <div>
    <label>Data da Atribuição:</label>
    <input type="date" id="data-atribuicao" />
  </div>
  <button class="btn btn-primary" onclick="window.print()">Imprimir</button>
  <button class="btn btn-secondary" onclick="salvarManuais()">Salvar Aulas</button>
</div>

<div class="doc-wrap">
  <div class="doc" id="doc">
    <div style="text-align:center;padding:40px;color:#6b7280;font-size:13px;">
      Selecione um professor para carregar o documento.
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ============================================================
// CONFIGURAÇÃO SUPABASE — SUBSTITUA PELAS CHAVES DO PROJETO NOVO
// ============================================================
const SUPABASE_URL = 'https://dflzprsopnwgobcxuqfu.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_HAMF9aaI6tEtztq4pXAVPw_PM_9wyad';
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// ============================================================
// UTILIDADES
// ============================================================
const $ = (id) => document.getElementById(id);
function toast(msg, tipo = '') {
  const t = $('toast');
  t.textContent = msg;
  t.className = 'toast show' + (tipo ? ' ' + tipo : '');
  setTimeout(() => t.className = 'toast', 2500);
}
function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function dataHojeBR() {
  const d = new Date();
  return d.toLocaleDateString('pt-BR');
}

// ============================================================
// AUTENTICAÇÃO
// ============================================================
async function requireLogin() {
  const { data: { session } } = await supabaseClient.auth.getSession();
  if (!session) { window.location.href = 'index.html'; return null; }
  return session;
}
async function logout() {
  await supabaseClient.auth.signOut();
  window.location.href = 'index.html';
}

// ============================================================
// ESTADO
// ============================================================
let professores = [];
let dadosDaca = { titular: [], carga: [], deixou: [], assumiu: [] };
let manuais = {};
let teacherAtualId = null;

// ============================================================
// CARREGAMENTO INICIAL
// ============================================================
async function carregarProfessores() {
  const { data, error } = await supabaseClient
    .from('teachers')
    .select('id, full_name, disciplines(name)')
    .order('full_name');
  if (error) return toast(error.message, 'error');

  professores = data || [];
  $('seletor-professor').innerHTML =
    '<option value="">Selecione...</option>' +
    professores.map(p =>
      `<option value="${p.id}">${esc(p.full_name)} — ${esc(p.disciplines?.name || 'sem disciplina')}</option>`
    ).join('');
}

async function carregarManuais(teacherId) {
  const { data, error } = await supabaseClient
    .from('daca_manual_fields')
    .select('*')
    .eq('teacher_id', teacherId);
  if (error) { toast(error.message, 'error'); return; }

  manuais = {};
  (data || []).forEach(m => {
    manuais[`${m.assignment_id}|${m.bloco}`] = {
      id: m.id,
      aulas_1sem: m.aulas_1sem,
      aulas_2sem: m.aulas_2sem,
      aulas_mes: m.aulas_mes,
    };
  });
}

// ============================================================
// CARREGAMENTO DO DOCUMENTO
// ============================================================
async function carregarDaca(teacherId) {
  if (!teacherId) {
    teacherAtualId = null;
    $('doc').innerHTML = '<div style="text-align:center;padding:40px;color:#6b7280;font-size:13px;">Selecione um professor para carregar o documento.</div>';
    return;
  }

  teacherAtualId = teacherId;

  const { data, error } = await supabaseClient.rpc('get_teacher_daca', { p_teacher_id: teacherId });
  if (error) return toast(error.message, 'error');

  dadosDaca = { titular: [], carga: [], deixou: [], assumiu: [] };
  (data || []).forEach(r => { dadosDaca[r.bloco].push(r); });

  await carregarManuais(teacherId);
  renderizar();
}

// ============================================================
// RENDERIZAÇÃO
// ============================================================
function renderizar() {
  const prof = professores.find(p => p.id === teacherAtualId);
  if (!prof) return;

  const ano = $('ano-doc').value || '2026';
  const dataAtrib = $('data-atribuicao').value
    ? new Date($('data-atribuicao').value + 'T00:00:00').toLocaleDateString('pt-BR')
    : dataHojeBR();

  // Unidade sede = escola com mais turmas atribuídas (titular + carga + assumiu)
  const contagemEscolas = {};
  ['titular', 'carga', 'assumiu'].forEach(b => {
    dadosDaca[b].forEach(r => {
      contagemEscolas[r.school_name] = (contagemEscolas[r.school_name] || 0) + 1;
    });
  });
  const unidadeSede = Object.keys(contagemEscolas).sort(
    (a, b) => contagemEscolas[b] - contagemEscolas[a]
  )[0] || '—';

  const linhasTitular = renderLinhas(dadosDaca.titular, 'titular', false);
  const linhasCarga = renderLinhas(dadosDaca.carga, 'carga', false);
  const linhasDeixou = renderLinhas(dadosDaca.deixou, 'deixou', true);
  const linhasAssumiu = renderLinhas(dadosDaca.assumiu, 'assumiu', true);

  const totalTitular = somarAulasMes('titular');
  const totalCarga = somarAulasMes('carga');

  // rowspan dos blocos: mínimo 1 para não quebrar layout quando vazio
  const rowspanTitular = Math.max(dadosDaca.titular.length, 1) + 1; // +1 do total
  const rowspanCarga = Math.max(dadosDaca.carga.length, 1) + 1;
  const rowspanSubst = Math.max(dadosDaca.deixou.length, 1) + Math.max(dadosDaca.assumiu.length, 1) + 2; // 2 títulos de seção

  $('doc').innerHTML = `
    <div class="doc-cabecalho">
      <div class="esq">
        <div class="brasao">
          <img src="brasao.png" alt="" onerror="this.style.display='none';this.parentNode.innerHTML='BRASÃO';" />
        </div>
        <div class="titulo">
          <div class="pref">PREFEITURA MUNICIPAL DE SANTA BRANCA</div>
          <div class="sec">SECRETARIA MUNICIPAL DE EDUCAÇÃO</div>
          <div class="end">Rua Independência, s/nº - Centro - Santa Branca – São Paulo – CEP: 12.380-000</div>
          <div class="tel">Tel: (12) 3972-1686 - 3972-3061 &nbsp;&nbsp; e-mail: semebranca@gmail.com</div>
        </div>
      </div>
      <div class="dir">
        DACA - DOCUMENTO DE ATRIBUIÇÃO<br>
        DE CLASSES E AULAS <span class="ano">${esc(ano)}</span>
      </div>
    </div>

    <div class="info-grid">
      <div class="cell"><span class="num">1- Unidade Sede de Controle de Frequência:</span> <span class="val">${esc(unidadeSede)}</span></div>
      <div class="cell"><span class="num">2- Data da Atribuição:</span> <span class="val">${esc(dataAtrib)}</span></div>
      <div class="cell"><span class="num">3- PEB:</span> <span class="val">—</span></div>
      <div class="cell"><span class="num">4- Disciplina:</span> <span class="val">${esc(prof.disciplines?.name || '—')}</span></div>

      <div class="cell"><span class="num">5- Classificação:</span> <span class="val">—</span></div>
      <div class="cell"><span class="num">6- Nome do Professor:</span> <span class="val">${esc(prof.full_name)}</span></div>
      <div class="cell"><span class="num">7- RG:</span> <span class="val">—</span></div>
      <div class="cell"><span class="num">8- CPF:</span> <span class="val">—</span></div>

      <div class="cell"><span class="num">9- Jornada:</span> <span class="val">—</span></div>
      <div class="cell"><span class="num">10- Categoria:</span> <span class="val">—</span></div>
      <div class="cell"><span class="num">11- Afastamento:</span> <span class="val">—</span></div>
      <div class="cell"><span class="num">12- Carga Suplementar:</span> <span class="val">—</span></div>

      <div class="cell row-last" style="grid-column: 1 / 4;"><span class="num">13- Professor Excedente:</span> <span class="val">—</span></div>
      <div class="cell row-last" style="border-right:none;border-bottom:none;"></div>
    </div>

    <table class="daca">
      <colgroup>
        <col style="width:20px">
        <col style="width:90px">
        <col style="width:30px">
        <col>
        <col style="width:28px">
        <col style="width:32px">
        <col style="width:32px">
        <col style="width:30px">
        <col style="width:30px">
        <col style="width:40px">
        <col style="width:80px">
      </colgroup>
      <thead>
        <tr>
          <th rowspan="2" class="bloco-label">Blocos</th>
          <th rowspan="2">Unidade Escolar</th>
          <th rowspan="2">Turma</th>
          <th rowspan="2">Classes Atribuídas</th>
          <th>Período</th>
          <th colspan="2">Situação das Aulas</th>
          <th colspan="3">Nº de Aulas</th>
          <th rowspan="2">Assinatura</th>
        </tr>
        <tr class="sub-header">
          <th>M/T/N/I</th>
          <th>Deixou</th>
          <th>Assumiu</th>
          <th>1ª Sem</th>
          <th>2ª Sem</th>
          <th>Aulas do Mês</th>
        </tr>
      </thead>
      <tbody>
        <!-- BLOCO I - TITULAR -->
        <tr>
          <td rowspan="${rowspanTitular}" class="bloco-label">I<br>Titular</td>
          ${linhasTitular || `<td colspan="10" style="text-align:center;color:#6b7280;">Nenhuma turma atribuída como Titular</td>`}
        </tr>
        <tr>
          <td colspan="9" style="background:#f9fafb;font-weight:700;text-align:right;font-size:8.5px;">
            Total de Aulas do Mês:
          </td>
          <td style="text-align:center;font-weight:700;">${totalTitular}</td>
        </tr>

        <!-- BLOCO II - CARGA SUPLEMENTAR -->
        <tr>
          <td rowspan="${rowspanCarga}" class="bloco-label">II<br>Carga<br>Suplem.</td>
          ${linhasCarga || `<td colspan="10" style="text-align:center;color:#6b7280;">Nenhuma turma em Carga Suplementar</td>`}
        </tr>
        <tr>
          <td colspan="9" style="background:#f9fafb;font-weight:700;text-align:right;font-size:8.5px;">
            Total de Aulas do Mês:
          </td>
          <td style="text-align:center;font-weight:700;">${totalCarga}</td>
        </tr>

        <!-- BLOCO III - SUBSTITUIÇÃO -->
        <tr>
          <td rowspan="${rowspanSubst}" class="bloco-label">III<br>Substituição</td>
          <td colspan="10" class="sec-titulo">Deixou as seguintes Classes:</td>
        </tr>
        ${linhasDeixou || `<tr><td colspan="10" style="text-align:center;color:#6b7280;font-size:9px;">—</td></tr>`}
        <tr>
          <td colspan="10" class="sec-titulo">Assumiu as seguintes Classes:</td>
        </tr>
        ${linhasAssumiu || `<tr><td colspan="10" style="text-align:center;color:#6b7280;font-size:9px;">—</td></tr>`}
      </tbody>
    </table>

    <div class="ata-box" contenteditable="true" id="ata-texto">
      <span class="ata-label">ATA:</span>
      Aos <strong>dezessete</strong> dias do mês de <strong>dezembro</strong> de <strong>dois mil e vinte e cinco</strong>, a partir das <strong>nove horas e trinta minutos</strong>, reuniram-se os servidores da Secretaria Municipal de Educação sob a presidência da Secretária de Educação <strong>Senhora Alexandra Cristina da Silva Fernandes Marques</strong>, a fim de proceder à <strong>Sessão de Atribuição de Classes e Aulas do ano letivo de ${esc(ano)}</strong>, conforme Edital nº 11/2025 – SME/CMSB, publicado no Diário Oficial do Município de <strong>25/11/2025</strong>. <em>(clique aqui para editar o texto da ata)</em>
    </div>

    <div class="assinaturas-finais">
      <div class="item">
        <div class="linha"></div>
        <div class="rotulo">ASSINATURA DO PROFESSOR</div>
      </div>
      <div class="item">
        <div class="linha"></div>
        <div class="rotulo">COMISSÃO DE ATRIBUIÇÃO</div>
      </div>
    </div>
  `;
}

function renderLinhas(lista, bloco, mostrarSituacao) {
  if (!lista || lista.length === 0) return '';
  return lista.map((r, i) => {
    const key = `${r.assignment_id}|${bloco}`;
    const m = manuais[key] || { aulas_1sem: '', aulas_2sem: '', aulas_mes: '' };
    return `
      <tr>
        <td>${esc(r.school_name)}</td>
        <td style="text-align:center;">${esc(r.class_name)}</td>
        <td>${esc(r.class_name)}</td>
        <td style="text-align:center;">${esc((r.class_period || '').charAt(0))}</td>
        ${mostrarSituacao
          ? `<td style="text-align:center;">${bloco === 'deixou' ? 'X' : ''}</td>
             <td style="text-align:center;">${bloco === 'assumiu' ? 'X' : ''}</td>`
          : `<td></td><td></td>`}
        <td><input class="field-edit" type="number" min="0"
            data-key="${key}" data-campo="aulas_1sem" value="${m.aulas_1sem ?? ''}"></td>
        <td><input class="field-edit" type="number" min="0"
            data-key="${key}" data-campo="aulas_2sem" value="${m.aulas_2sem ?? ''}"></td>
        <td><input class="field-edit" type="number" min="0"
            data-key="${key}" data-campo="aulas_mes" value="${m.aulas_mes ?? ''}"></td>
        <td><div class="assinatura-linha"></div></td>
      </tr>`;
  }).join('');
}

function somarAulasMes(bloco) {
  return dadosDaca[bloco].reduce((s, r) => {
    const key = `${r.assignment_id}|${bloco}`;
    const m = manuais[key] || {};
    return s + (parseInt(m.aulas_mes) || 0);
  }, 0);
}

// ============================================================
// SALVAR DADOS MANUAIS
// ============================================================
async function salvarManuais() {
  if (!teacherAtualId) return toast('Selecione um professor primeiro', 'error');

  const inputs = document.querySelectorAll('input.field-edit[data-key]');
  const agrupados = {};

  inputs.forEach(inp => {
    const key = inp.dataset.key;
    const campo = inp.dataset.campo;
    const [assignment_id, bloco] = key.split('|');
    if (!agrupados[key]) agrupados[key] = { assignment_id, bloco };
    agrupados[key][campo] = inp.value === '' ? null : parseInt(inp.value, 10);
  });

  const registros = Object.values(agrupados).map(r => ({
    teacher_id: teacherAtualId,
    assignment_id: r.assignment_id,
    bloco: r.bloco,
    aulas_1sem: r.aulas_1sem ?? 0,
    aulas_2sem: r.aulas_2sem ?? 0,
    aulas_mes: r.aulas_mes ?? 0,
    updated_at: new Date().toISOString(),
  }));

  if (registros.length === 0) return toast('Nada para salvar');

  const { error } = await supabaseClient
    .from('daca_manual_fields')
    .upsert(registros, { onConflict: 'teacher_id,assignment_id,bloco' });

  if (error) return toast(error.message, 'error');
  toast('Dados manuais salvos', 'success');
  await carregarManuais(teacherAtualId);
  renderizar();
}

// ============================================================
// EVENTOS
// ============================================================
$('seletor-professor').addEventListener('change', (e) => carregarDaca(e.target.value));
$('ano-doc').addEventListener('change', () => { if (teacherAtualId) renderizar(); });
$('data-atribuicao').addEventListener('change', () => { if (teacherAtualId) renderizar(); });

// INICIALIZAÇÃO
// ============================================================
(async () => {
  const session = await requireLogin();
  if (!session) return;
  $('logout').onclick = (e) => { e.preventDefault(); logout(); };
  await carregarProfessores();
})();
