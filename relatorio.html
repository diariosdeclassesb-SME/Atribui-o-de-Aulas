<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Relatório Geral — Sistema de Atribuição de Aulas</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root { --primary: #2563eb; --primary-dark: #1e40af; --bg: #f3f4f6; --card: #fff; --border: #e5e7eb; --text: #111827; --muted: #6b7280; }
  * { box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; margin: 0; background: var(--bg); color: var(--text); }
  header { background: var(--card); border-bottom: 1px solid var(--border); padding: 12px 24px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 10; }
  header h1 { font-size: 18px; margin: 0; }
  header nav a { color: var(--text); text-decoration: none; margin-right: 16px; font-size: 14px; }
  header nav a.active { color: var(--primary); font-weight: 600; }
  .container { max-width: 1200px; margin: 24px auto; padding: 0 16px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 16px; margin-bottom: 16px; }
  .filtros { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; align-items: end; }
  label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  input, select { width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 14px; background: white; }
  .btn { padding: 8px 16px; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: 500; }
  .btn-primary { background: var(--primary); color: white; }
  .btn-primary:hover { background: var(--primary-dark); }
  .btn-secondary { background: #e5e7eb; color: #111; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); }
  th { background: #f9fafb; font-weight: 600; color: var(--muted); font-size: 12px; text-transform: uppercase; }
  .right { text-align: right; } .center { text-align: center; }
  .empty { color: var(--muted); padding: 30px; text-align: center; }
  .totais-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .totais-grid .item { background: #f9fafb; border-radius: 6px; padding: 12px 16px; }
  .totais-grid .label { font-size: 11px; color: var(--muted); text-transform: uppercase; }
  .totais-grid .valor { font-size: 22px; font-weight: 700; color: var(--primary); }

  tr.prof-row { cursor: pointer; }
  tr.prof-row:hover { background: #f9fafb; }
  tr.prof-row .toggle {
    display: inline-block; width: 16px; color: var(--primary);
    font-weight: 700; transition: transform .2s;
  }
  tr.prof-row.expanded .toggle { transform: rotate(90deg); }

  tr.detail-row { display: none; background: #f9fafb; }
  tr.detail-row.show { display: table-row; }
  tr.detail-row td { padding: 0; border-bottom: 1px solid var(--border); }
  .detail-inner { padding: 12px 20px 16px 40px; }
  .detail-inner h4 {
    margin: 0 0 8px; font-size: 12px; color: var(--muted);
    text-transform: uppercase; letter-spacing: .5px;
  }
  .detail-inner table { font-size: 13px; background: white; border-radius: 6px; overflow: hidden; }
  .detail-inner th, .detail-inner td { padding: 6px 10px; }
  .badge {
    display: inline-block; padding: 2px 8px; border-radius: 4px;
    font-size: 11px; font-weight: 600;
  }
  .badge-titular { background: #dbeafe; color: #1e40af; }
  .badge-carga { background: #fef3c7; color: #92400e; }
  .badge-subst { background: #ede9fe; color: #5b21b6; }

  @media print {
    @page { size: A4 landscape; margin: 10mm; }
    header, .filtros, .no-print { display: none !important; }
    body { background: #fff; }
    .container { max-width: 100%; margin: 0; padding: 0; }
    .card { border: none; padding: 0; }
    tr.detail-row { display: table-row !important; }
  }
  .toast { position: fixed; bottom: 20px; right: 20px; background: #111827; color: white; padding: 12px 20px; border-radius: 6px; font-size: 14px; opacity: 0; transition: opacity .3s; pointer-events: none; }
  .toast.show { opacity: 1; }
</style>
</head>
<body>

<header>
  <h1>Sistema de Atribuição de Aulas</h1>
  <nav>
    <a href="cadastros.html">Cadastros</a>
    <a href="atribuicoes.html">Atribuições</a>
    <a href="configuracoes.html">Configurações</a>
    <a href="relatorio.html" class="active">Relatório</a>
    <a href="professor.html">DACA</a>
    <a href="#" id="logout">Sair</a>
  </nav>
</header>

<div class="container">
  <div class="card no-print">
    <div class="filtros">
      <div><label>Escola</label><input id="f-escola" placeholder="Filtrar por escola" /></div>
      <div>
        <label>Período</label>
        <select id="f-periodo">
          <option value="">Todos</option><option>Manhã</option><option>Tarde</option>
          <option>Noite</option><option>Integral</option>
        </select>
      </div>
      <div><label>Professor</label><input id="f-professor" placeholder="Filtrar por nome" /></div>
      <div style="display:flex; gap:8px; flex-wrap:wrap;">
        <button class="btn btn-primary" onclick="carregarRelatorio()">Filtrar</button>
        <button class="btn btn-secondary" onclick="limparFiltros()">Limpar</button>
        <button class="btn btn-secondary" onclick="expandirTodos()">Expandir todos</button>
        <button class="btn btn-secondary" onclick="window.print()">Imprimir</button>
      </div>
    </div>
  </div>

  <div class="card">
    <h2 style="text-align:center;margin:0 0 4px;font-size:16px;">Prefeitura Municipal de Santa Branca</h2>
    <p style="text-align:center;color:var(--muted);margin:0 0 20px;font-size:13px;">
      Relatório Geral de Atribuições de Aulas — <span id="data-rel"></span>
    </p>

    <div class="totais-grid">
      <div class="item"><div class="label">Professores</div><div class="valor" id="t-prof">0</div></div>
      <div class="item"><div class="label">Turmas atribuídas</div><div class="valor" id="t-turmas">0</div></div>
      <div class="item"><div class="label">Aulas</div><div class="valor" id="t-aulas">0</div></div>
      <div class="item"><div class="label">Escolas</div><div class="valor" id="t-escolas">0</div></div>
    </div>

    <table>
      <thead>
        <tr>
          <th style="width:30px"></th>
          <th>Professor</th>
          <th>Disciplina</th>
          <th>Escola Sede</th>
          <th class="center">Turmas</th>
          <th class="center">Aulas</th>
          <th class="center">Escolas</th>
        </tr>
      </thead>
      <tbody id="lista-rel">
        <tr><td colspan="7" class="empty">Carregando...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const SUPABASE_URL = 'https://dflzprsopnwgobcxuqfu.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_HAMF9aaI6tEtztq4pXAVPw_PM_9wyad';
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const $ = (id) => document.getElementById(id);
function toast(msg) {
  const t = $('toast');
  t.textContent = msg; t.className = 'toast show';
  setTimeout(() => t.className = 'toast', 2500);
}
function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
async function requireLogin() {
  const { data: { session } } = await supabaseClient.auth.getSession();
  if (!session) { window.location.href = 'index.html'; return null; }
  return session;
}
async function logout() {
  await supabaseClient.auth.signOut();
  window.location.href = 'index.html';
}

let detalhesCache = {}; // teacherId -> array de turmas
let professoresComDados = [];

async function carregarRelatorio() {
  const escola = $('f-escola').value.trim() || null;
  const periodo = $('f-periodo').value || null;
  const professor = $('f-professor').value.trim() || null;

  const { data, error } = await supabaseClient.rpc('get_relatorio_geral', {
    p_escola: escola, p_periodo: periodo, p_professor: professor,
  });
  if (error) return toast(error.message);

  const linhas = data || [];
  professoresComDados = linhas;

  $('lista-rel').innerHTML = linhas.length
    ? linhas.map(r => `
        <tr class="prof-row" data-teacher="${r.teacher_id}" onclick="toggleDetalhes('${r.teacher_id}', this)">
          <td class="center"><span class="toggle">▶</span></td>
          <td>${esc(r.teacher_name)}</td>
          <td>${esc(r.discipline_name || '—')}</td>
          <td>${esc(r.escola_sede)}</td>
          <td class="center">${r.total_turmas}</td>
          <td class="center">${r.total_aulas}</td>
          <td class="center">${r.escolas_distintas}</td>
        </tr>
        <tr class="detail-row" id="detail-${r.teacher_id}">
          <td colspan="7"><div class="detail-inner" id="detail-inner-${r.teacher_id}">
            <em style="color:var(--muted);font-size:13px;">Clique para carregar as turmas...</em>
          </div></td>
        </tr>`).join('')
    : '<tr><td colspan="7" class="empty">Nenhum registro encontrado.</td></tr>';

  // Totais
  $('t-prof').textContent = linhas.length;
  $('t-turmas').textContent = linhas.reduce((s, r) => s + Number(r.total_turmas), 0);
  $('t-aulas').textContent = linhas.reduce((s, r) => s + Number(r.total_aulas), 0);
  $('t-escolas').textContent = new Set(linhas.map(r => r.escola_sede).filter(e => e !== '—')).size;

  $('data-rel').textContent = new Date().toLocaleDateString('pt-BR');
}

async function toggleDetalhes(teacherId, row) {
  const detailRow = document.getElementById('detail-' + teacherId);
  const isOpen = detailRow.classList.contains('show');

  if (isOpen) {
    detailRow.classList.remove('show');
    row.classList.remove('expanded');
    return;
  }

  row.classList.add('expanded');
  detailRow.classList.add('show');

  // Carrega só uma vez
  if (!detalhesCache[teacherId]) {
    const { data, error } = await supabaseClient.rpc('get_teacher_daca', { p_teacher_id: teacherId });
    if (error) {
      document.getElementById('detail-inner-' + teacherId).innerHTML =
        `<span style="color:#dc2626;">Erro: ${esc(error.message)}</span>`;
      return;
    }
    detalhesCache[teacherId] = data || [];
  }

  renderDetalhes(teacherId, detalhesCache[teacherId]);
}

function renderDetalhes(teacherId, lista) {
  const inner = document.getElementById('detail-inner-' + teacherId);

  const blocoLabel = {
    titular: 'Titular',
    carga: 'Carga Suplementar',
    deixou: 'Deixou a turma',
    assumiu: 'Assumiu como substituto',
  };
  const blocoClasse = {
    titular: 'badge-titular',
    carga: 'badge-carga',
    deixou: 'badge-subst',
    assumiu: 'badge-subst',
  };

  if (lista.length === 0) {
    inner.innerHTML = '<em style="color:var(--muted);font-size:13px;">Nenhuma turma atribuída.</em>';
    return;
  }

  // Agrupa por bloco
  const porBloco = { titular: [], carga: [], deixou: [], assumiu: [] };
  lista.forEach(r => porBloco[r.bloco]?.push(r));

  const blocos = ['titular', 'carga', 'deixou', 'assumiu'].filter(b => porBloco[b].length > 0);

  inner.innerHTML = blocos.map(bloco => `
    <h4><span class="badge ${blocoClasse[bloco]}">${blocoLabel[bloco]}</span> — ${porBloco[bloco].length} turma(s)</h4>
    <table>
      <thead>
        <tr>
          <th>Escola</th>
          <th>Turma</th>
          <th>Período</th>
          <th>Disciplina</th>
          <th class="center">Aulas</th>
        </tr>
      </thead>
      <tbody>
        ${porBloco[bloco].map(t => `
          <tr>
            <td>${esc(t.school_name)}</td>
            <td>${esc(t.class_name)}</td>
            <td>${esc(t.class_period)}</td>
            <td>${esc(t.discipline_name)}</td>
            <td class="center">${t.lesson_count}</td>
          </tr>`).join('')}
      </tbody>
    </table>
  `).join('');
}

async function expandirTodos() {
  const rows = document.querySelectorAll('tr.prof-row');
  for (const row of rows) {
    const teacherId = row.dataset.teacher;
    if (!document.getElementById('detail-' + teacherId).classList.contains('show')) {
      await toggleDetalhes(teacherId, row);
    }
  }
}

function limparFiltros() {
  $('f-escola').value = ''; $('f-periodo').value = ''; $('f-professor').value = '';
  carregarRelatorio();
}

(async () => {
  const session = await requireLogin();
  if (!session) return;
  $('logout').onclick = (e) => { e.preventDefault(); logout(); };
  carregarRelatorio();
})();
</script>
</body>
</html>
