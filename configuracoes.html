<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Configurações — Sistema de Atribuição de Aulas</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root { --primary: #2563eb; --primary-dark: #1e40af; --bg: #f3f4f6; --card: #fff; --border: #e5e7eb; --text: #111827; --muted: #6b7280; }
  * { box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; margin: 0; background: var(--bg); color: var(--text); }
  header { background: var(--card); border-bottom: 1px solid var(--border); padding: 12px 24px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 10; }
  header h1 { font-size: 18px; margin: 0; }
  header nav a { color: var(--text); text-decoration: none; margin-right: 16px; font-size: 14px; }
  header nav a.active { color: var(--primary); font-weight: 600; }
  .container { max-width: 900px; margin: 24px auto; padding: 0 16px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 20px; margin-bottom: 16px; }
  .card h2 { font-size: 15px; margin: 0 0 16px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
  label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; margin-top: 12px; }
  input { width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 14px; background: white; font-family: inherit; }
  .btn { padding: 8px 16px; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: 500; }
  .btn-primary { background: var(--primary); color: white; }
  .btn-primary:hover { background: var(--primary-dark); }
  .btn-secondary { background: #e5e7eb; color: #111; }
  .btn-danger { background: #dc2626; color: white; }
  .upload-area {
    margin-top: 8px; border: 2px dashed var(--border); border-radius: 8px;
    padding: 20px; text-align: center; cursor: pointer; background: #fafafa;
    transition: all .2s;
  }
  .upload-area:hover { border-color: var(--primary); background: #eff6ff; }
  .upload-area.drag { border-color: var(--primary); background: #dbeafe; }
  .upload-area .icon { font-size: 32px; color: var(--muted); margin-bottom: 6px; }
  .upload-area .texto { font-size: 13px; color: var(--muted); }
  .preview { margin-top: 16px; padding: 16px; background: #f9fafb; border-radius: 6px; text-align: center; position: relative; }
  .preview img { max-height: 120px; max-width: 100%; }
  .progress { margin-top: 10px; height: 6px; background: #e5e7eb; border-radius: 3px; overflow: hidden; }
  .progress .bar { height: 100%; background: var(--primary); width: 0%; transition: width .2s; }
  .toast { position: fixed; bottom: 20px; right: 20px; background: #111827; color: white; padding: 12px 20px; border-radius: 6px; font-size: 14px; opacity: 0; transition: opacity .3s; pointer-events: none; }
  .toast.show { opacity: 1; } .toast.error { background: #dc2626; } .toast.success { background: #059669; }
</style>
</head>
<body>

<header>
  <h1>Sistema de Atribuição de Aulas</h1>
  <nav>
    <a href="cadastros.html">Cadastros</a>
    <a href="atribuicoes.html">Atribuições</a>
    <a href="configuracoes.html" class="active">Configurações</a>
    <a href="relatorio.html">Relatório</a>
    <a href="professor.html">DACA</a>
    <a href="#" id="logout">Sair</a>
  </nav>
</header>

<div class="container">
  <div class="card">
    <h2>Dados do cabeçalho (aparecem no topo do DACA)</h2>

    <label>Nome da Prefeitura</label>
    <input id="cfg-prefeitura" />

    <label>Nome da Secretaria</label>
    <input id="cfg-secretaria" />

    <label>Endereço completo</label>
    <input id="cfg-endereco" />

    <label>Telefone(s)</label>
    <input id="cfg-telefone" />

    <label>E-mail</label>
    <input id="cfg-email" />

    <label>Brasão (imagem)</label>
    <div class="upload-area" id="upload-area">
      <div class="icon">🏛️</div>
      <div class="texto">
        <strong>Clique para escolher</strong> ou arraste a imagem aqui<br>
        <small>PNG, JPG ou SVG — até 2 MB</small>
      </div>
      <input type="file" id="file-input" accept="image/png,image/jpeg,image/svg+xml,image/webp" style="display:none">
    </div>
    <div class="progress" id="progress-box" style="display:none;">
      <div class="bar" id="progress-bar"></div>
    </div>

    <div class="preview" id="preview-logo">
      <span style="color:var(--muted);font-size:13px;">Nenhum brasão carregado</span>
    </div>

    <div style="margin-top:20px; display:flex; gap:10px; flex-wrap:wrap;">
      <button class="btn btn-primary" onclick="salvar()">Salvar configurações</button>
      <button class="btn btn-secondary" onclick="carregar()">Recarregar</button>
      <button class="btn btn-danger" id="btn-remover-logo" onclick="removerLogo()" style="display:none;">Remover brasão</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const SUPABASE_URL = 'https://dflzprsopnwgobcxuqfu.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_HAMF9aaI6tEtztq4pXAVPw_PM_9wyad';
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const $ = (id) => document.getElementById(id);
function toast(msg, tipo = '') {
  const t = $('toast');
  t.textContent = msg;
  t.className = 'toast show' + (tipo ? ' ' + tipo : '');
  setTimeout(() => t.className = 'toast', 2500);
}
async function requireLogin() {
  const { data: { session } } = await supabaseClient.auth.getSession();
  if (!session) { window.location.href = 'index.html'; return null; }
  return session;
}
async function logout() {
  await supabaseClient.auth.signOut();
  window.location.href = 'index.html';
}

let logoAtualUrl = null;

async function carregar() {
  const { data, error } = await supabaseClient.from('daca_settings').select('*').eq('id', 1).maybeSingle();
  if (error) return toast(error.message, 'error');
  if (!data) return;

  $('cfg-prefeitura').value = data.prefeitura || '';
  $('cfg-secretaria').value = data.secretaria || '';
  $('cfg-endereco').value = data.endereco || '';
  $('cfg-telefone').value = data.telefone || '';
  $('cfg-email').value = data.email || '';
  logoAtualUrl = data.logo_url || null;
  atualizarPreview(logoAtualUrl);
}

function atualizarPreview(url) {
  const p = $('preview-logo');
  if (url) {
    p.innerHTML = `<img src="${url}" alt="Brasão" onerror="this.parentNode.innerHTML='<span style=&quot;color:#dc2626;font-size:13px&quot;>Erro ao carregar imagem</span>'">`;
    $('btn-remover-logo').style.display = 'inline-block';
  } else {
    p.innerHTML = '<span style="color:var(--muted);font-size:13px;">Nenhum brasão carregado</span>';
    $('btn-remover-logo').style.display = 'none';
  }
}

// ------- Upload -------
const uploadArea = $('upload-area');
const fileInput = $('file-input');

uploadArea.addEventListener('click', () => fileInput.click());
uploadArea.addEventListener('dragover', (e) => {
  e.preventDefault();
  uploadArea.classList.add('drag');
});
uploadArea.addEventListener('dragleave', () => uploadArea.classList.remove('drag'));
uploadArea.addEventListener('drop', (e) => {
  e.preventDefault();
  uploadArea.classList.remove('drag');
  if (e.dataTransfer.files.length > 0) {
    fazerUpload(e.dataTransfer.files[0]);
  }
});
fileInput.addEventListener('change', (e) => {
  if (e.target.files.length > 0) fazerUpload(e.target.files[0]);
});

async function fazerUpload(file) {
  if (file.size > 2 * 1024 * 1024) return toast('Arquivo maior que 2 MB', 'error');
  const tipos = ['image/png', 'image/jpeg', 'image/svg+xml', 'image/webp'];
  if (!tipos.includes(file.type)) return toast('Formato inválido. Use PNG, JPG, SVG ou WebP.', 'error');

  // Nome único baseado em timestamp + nome original
  const ext = file.name.split('.').pop().toLowerCase();
  const nomeArquivo = `brasao.${ext}`; // sempre sobrescreve o mesmo nome

  $('progress-box').style.display = 'block';
  $('progress-bar').style.width = '30%';

  // Remove o antigo (se existir) para não acumular lixo
  if (logoAtualUrl) {
    const caminhoAntigo = logoAtualUrl.split('/storage/v1/object/public/brasao/')[1];
    if (caminhoAntigo) {
      await supabaseClient.storage.from('brasao').remove([caminhoAntigo]);
    }
  }

  const { error: errUpload } = await supabaseClient.storage
    .from('brasao')
    .upload(nomeArquivo, file, { upsert: true, cacheControl: '3600', contentType: file.type });

  $('progress-bar').style.width = '100%';

  if (errUpload) {
    $('progress-box').style.display = 'none';
    return toast('Erro upload: ' + errUpload.message, 'error');
  }

  // URL pública
  const { data: pub } = supabaseClient.storage.from('brasao').getPublicUrl(nomeArquivo);
  const url = pub.publicUrl + '?v=' + Date.now(); // cache busting

  // Salva a URL no banco
  const { error: errDb } = await supabaseClient.from('daca_settings')
    .update({ logo_url: url, updated_at: new Date().toISOString() })
    .eq('id', 1);

  $('progress-box').style.display = 'none';
  $('progress-bar').style.width = '0%';

  if (errDb) return toast('Erro ao salvar URL: ' + errDb.message, 'error');

  logoAtualUrl = url;
  atualizarPreview(url);
  toast('Brasão atualizado', 'success');
}

async function removerLogo() {
  if (!confirm('Remover o brasão atual?')) return;
  if (logoAtualUrl) {
    const caminhoAntigo = logoAtualUrl.split('/storage/v1/object/public/brasao/')[1];
    if (caminhoAntigo) {
      await supabaseClient.storage.from('brasao').remove([caminhoAntigo.split('?')[0]]);
    }
  }
  const { error } = await supabaseClient.from('daca_settings')
    .update({ logo_url: null, updated_at: new Date().toISOString() }).eq('id', 1);
  if (error) return toast(error.message, 'error');
  logoAtualUrl = null;
  atualizarPreview(null);
  toast('Brasão removido', 'success');
}

// ------- Salvar textos -------
async function salvar() {
  const payload = {
    id: 1,
    prefeitura: $('cfg-prefeitura').value.trim(),
    secretaria: $('cfg-secretaria').value.trim(),
    endereco: $('cfg-endereco').value.trim(),
    telefone: $('cfg-telefone').value.trim(),
    email: $('cfg-email').value.trim(),
    logo_url: logoAtualUrl,
    updated_at: new Date().toISOString(),
  };
  const { error } = await supabaseClient.from('daca_settings').upsert(payload, { onConflict: 'id' });
  if (error) return toast(error.message, 'error');
  toast('Configurações salvas', 'success');
}

(async () => {
  const session = await requireLogin();
  if (!session) return;
  $('logout').onclick = (e) => { e.preventDefault(); logout(); };
  carregar();
})();
</script>
</body>
</html>
