<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Autenticando...</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div style="text-align: center; margin-top: 50px; font-family: sans-serif;">
        <p id="status">Autenticando via Portal SME, aguarde...</p>
        <p id="error" style="color: red; font-weight: bold; display: none;"></p>
    </div>
    <script>
        const PORTAL_SUPABASE_URL = 'https://zoyiphlxylsxhefmkcwz.supabase.co';
        const PORTAL_SUPABASE_KEY = 'sb_publishable_bgyHgeKxR7-3ftWx0wYVxg_5k_n7Pzx';
        
        const supabasePortal = window.supabase.createClient(PORTAL_SUPABASE_URL, PORTAL_SUPABASE_KEY, { 
            auth: { flowType: 'pkce', detectSessionInUrl: true } 
        });

        async function processarCallback() {
            const code = new URLSearchParams(window.location.search).get('code');
            
            if (!code) { 
                document.getElementById('status').textContent = 'Nenhum código encontrado. Redirecionando para login...';
                setTimeout(() => { window.location.href = 'index.html'; }, 2000);
                return; 
            }

            const { data, error } = await supabasePortal.auth.exchangeCodeForSession(code);
            
            if (error) {
                document.getElementById('status').textContent = 'Falha na autenticação:';
                const errorEl = document.getElementById('error');
                errorEl.textContent = error.message;
                errorEl.style.display = 'block';
                console.error('Erro completo:', error);
                return;
            }
            
            // PÁGINA PRINCIPAL DO ATRIBUIÇÃO
            window.location.href = 'cadastros.html'; 
        }
        
        processarCallback();
    </script>
</body>
</html>
